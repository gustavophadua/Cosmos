name: Cosmos - validar e publicar Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cosmos-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Dependencias de testes OTS offline
        run: python -m pip install --target node_modules/.cosmos-ots-python -r scripts/requirements-ots.txt
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - name: Validar caminhos e exportacao publica
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifest=JSON.parse(readFileSync('dist/manifest.webmanifest','utf8'));
          if(manifest.name!=='Cosmos'||manifest.scope!=='/Cosmos/'||manifest.start_url!=='/Cosmos/')throw Error('Manifest invalido');
          if(!readFileSync('dist/index.html','utf8').includes('/Cosmos/assets/'))throw Error('Base invalida');
          if(createHash('sha256').update(readFileSync('dist/cosmos-502426c.json')).digest('hex')!=='9e4d4fd13f16ff48d79ebbbb6c354bf5802374b2a2d247dc31d8d9890492f267')throw Error('Exportacao historica alterada');
          JS
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: publicar
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
