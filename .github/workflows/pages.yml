name: Cosmos - validar e publicar Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cosmos-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Dependencias de testes OTS offline
        run: python -m pip install --target node_modules/.cosmos-ots-python -r scripts/requirements-ots.txt
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - name: Validar caminhos e exportacao publica
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifest=JSON.parse(readFileSync('dist/manifest.webmanifest','utf8'));
          if(manifest.name!=='Cosmos'||manifest.scope!=='/Cosmos/'||manifest.start_url!=='/Cosmos/')throw Error('Manifest invalido');
          if(!readFileSync('dist/index.html','utf8').includes('/Cosmos/assets/'))throw Error('Base invalida');
          if(createHash('sha256').update(readFileSync('dist/cosmos-502426c.json')).digest('hex')!=='9e4d4fd13f16ff48d79ebbbb6c354bf5802374b2a2d247dc31d8d9890492f267')throw Error('Exportacao historica alterada');
          JS
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: publicar
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
