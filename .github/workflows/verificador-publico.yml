# O verificador público do Cosmos 502426c, numa máquina do GitHub, a cada mudança no main (ou quando alguém pede, em
# Actions → Verificador público → Run workflow). Qualquer pessoa pode refazer os mesmos passos a partir do repositório.
#
#   cadeia: os 13 arquivos protegidos pelos bytes exatos, a cadeia F0–F8 (C1–C8), o hash e a assinatura Ed25519 de
#           cada fase, o checkpoint Merkle e o alvo do carimbo OpenTimestamps (testes/verificador-publico.test.ts).
#   provas: as provas Alethe pelo Carcara, compilado do código-fonte num commit fixo, com os estragos e os ataques; o
#           vínculo fórmula-problema pela implementação independente (escrita pelo GPT só pela especificação); os
#           modelos; os registros de exemplo; e o lote cego 1, com 62 registros (especificacao/provas-t1/conferir.py).
#           E a prova pública 5p4c (software-public-v1/) por dois Carcaras independentes, com estragos
#           (scripts/conferir-5p4c.py); a saída da GPU não está no pacote, e nada aqui atesta hardware.
#   carimbo: a prova OpenTimestamps contra o cabeçalho do bloco Bitcoin em fontes públicas.
#
# Integridade e autoria não comprovam a verdade das afirmações; o carimbo Bitcoin só conta confirmado por um cliente OTS.
name: Verificador público

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificador-publico-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cadeia:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      # o build regenera dist/cosmos-502426c.json, o 13º arquivo protegido
      - run: npm run build
      - name: Conferir cadeia, selo, checkpoint e arquivos protegidos
        env:
          VERIFICADOR_EXIGE_DIST: '1'
          VERIFICADOR_RELATORIO: ${{ runner.temp }}/cadeia.md
        run: |
          npx vitest run testes/verificador-publico.test.ts
          echo "Commit conferido: \`$GITHUB_SHA\`" >> "$RUNNER_TEMP/cadeia.md"
          cat "$RUNNER_TEMP/cadeia.md" >> "$GITHUB_STEP_SUMMARY"

  carimbo:
    # a prova OpenTimestamps contra o cabeçalho do bloco Bitcoin, buscado em pelo menos duas fontes públicas que têm de
    # concordar (hash do bloco, prova de trabalho, raiz Merkle); o resultado tem de ser o registrado em
    # src/dados/carimbo-bitcoin.json, que é o que o site mostra
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Biblioteca oficial do OpenTimestamps (versões fixas)
        run: python -m pip install --target node_modules/.cosmos-ots-python -r scripts/requirements-ots.txt
      - name: Conferir o carimbo Bitcoin
        run: |
          python scripts/cosmos-ots.py verify-publico > "$RUNNER_TEMP/ots.json"
          python - "$RUNNER_TEMP/ots.json" <<'PY'
          import hashlib, json, os, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          c = json.load(open('src/dados/carimbo-bitcoin.json', encoding='utf-8'))
          sha = lambda p: hashlib.sha256(open(p, 'rb').read()).hexdigest()
          erros = []
          for campo in ('altura', 'bloco', 'tempo_bloco_utc', 'sha256_alvo', 'sha256_prova'):
              if r.get(campo) != c[campo]:
                  erros.append(f'{campo}: conferido {r.get(campo)!r}, registrado {c[campo]!r}')
          if sha(c['prova']) != c['sha256_prova']: erros.append('a prova OTS não tem o SHA-256 registrado')
          if sha(c['alvo']) != c['sha256_alvo']: erros.append('o alvo não tem o SHA-256 registrado')
          if sha(c['prova_calendario_original']['arquivo']) != c['prova_calendario_original']['sha256']: erros.append('a prova original dos calendários foi alterada')
          if open(c['alvo'], encoding='ascii').read().strip() != c['resumo_cadeia']: erros.append('o alvo não é o resumo da cadeia')
          if not r.get('confirmacaoVerificada'): erros.append('confirmação não verificada')
          linhas = ['## Verificador público · carimbo Bitcoin', '', '| Conferência | Resultado |', '| --- | --- |',
                    f"| Bloco | {r.get('altura')} · `{r.get('bloco')}` |", f"| Horário do bloco | {r.get('tempo_bloco_utc')} |",
                    f"| Confirmações agora | {r.get('confirmacoes')} |", f"| Fontes que concordaram | {', '.join(r.get('fontes', []))} |",
                    f"| Alvo (resumo da cadeia) | `{r.get('sha256_alvo')}` |", f"| Prova OTS | `{r.get('sha256_prova')}` |",
                    f"| Igual ao registrado no site | {'sim' if not erros else 'NÃO'} |", '', r.get('limite', ''), '']
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('\n'.join(linhas + [f'- {e}' for e in erros]) + '\n')
          if erros: sys.exit('\n'.join(erros))
          PY
      - name: Âncora do checkpoint (a raiz Merkle no OpenTimestamps)
        env:
          COSMOS_OTS_ALVO: public/cosmos-checkpoint-raiz.txt
        run: |
          python scripts/cosmos-ots.py estado | tee "$RUNNER_TEMP/ancora.json"
          python - "$RUNNER_TEMP/ancora.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          if not r.get('vinculoValido'): sys.exit('a prova OTS do checkpoint não é da raiz publicada')
          linha = (f"bloco {r['altura']} ({r['tempo_bloco_utc']}), conferido em {', '.join(r['fontes'])}" if r.get('confirmacaoVerificada')
                   else 'enviada aos calendários; a confirmação no Bitcoin ainda não está na prova' + (f" ({r['erro']})" if r.get('erro') else ''))
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write(f"\n**Âncora do checkpoint** (raiz `{r['sha256_alvo'][:16]}…`): {linha}\n")
          PY

  cadeias:
    # as cadeias pessoais publicadas em cadeias/: cada registro revelado é aberto com certificado (tradução t1 pelo Z3 e
    # prova pelo cvc5 1.4.2, ou modelo finito pelo motor), conferido pelo Caderno e depois, de forma independente, pela
    # conferência de registros-v1 (registros.py) e pelo leitor do GPT, com as provas no Carcara do commit fixo (o mesmo
    # da parte provas: a release 1.1.0 não tem --rare-file nem --rup-resolution, que a conferência usa)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARCARA_COMMIT: 20bf49c5ce31089ac83118574c888669355aaae1
      RUST_VERSAO: 1.99.1
      SISTEMA: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: cvc5 1.4.2 (binário da release, hash fixado)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 \
            -o "$RUNNER_TEMP/cvc5.zip" https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          printf '%s  %s\n' 7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8 "$RUNNER_TEMP/cvc5.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP/cvc5"
          echo "CVC5=$(find "$RUNNER_TEMP/cvc5" -type f -name cvc5 -perm -u+x | head -1)" >> "$GITHUB_ENV"
      - name: Rust
        run: rustup toolchain install "$RUST_VERSAO" --profile minimal && rustup default "$RUST_VERSAO" && rustc --version
      - name: m4, que a GMP do Carcara precisa para compilar
        run: sudo apt-get update && sudo apt-get install -y m4
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: ~/.cargo/bin/carcara
          key: carcara-${{ env.CARCARA_COMMIT }}-rust-${{ env.RUST_VERSAO }}-${{ env.SISTEMA }}
      - name: Compilar o Carcara
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/ufmg-smite/carcara.git --rev "$CARCARA_COMMIT" carcara
      - name: SymPy
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install --require-hashes --only-binary :all: --no-deps -r especificacao/provas-t1/requisitos.txt
      - name: Abrir os registros revelados e conferir pelo Caderno
        env:
          CADEIAS_SAIDA: ${{ runner.temp }}/cadeias
        run: |
          "$CVC5" --version | head -1
          npx vitest run testes/cadeias-publicadas.test.ts
      - name: Conferência independente (registros.py, leitor do GPT, Carcara)
        run: ~/venv/bin/python scripts/conferir-cadeias.py --carcara ~/.cargo/bin/carcara --saida "$RUNNER_TEMP/cadeias"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: registros-abertos-${{ github.sha }}
          path: ${{ runner.temp }}/cadeias
          if-no-files-found: ignore

  provas:
    # o sistema, o Rust e o commit do Carcara ficam fixos: o mesmo commit compilado por outro Rust, ou noutro sistema,
    # não é a mesma compilação (o commit é o da versão em desenvolvimento: a que o cvc5 1.4.2 indica, 394edbb, não
    # conhece as regras de aritmética não linear la_mult_sign e la_mult_abs_comparison)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARCARA_COMMIT: 20bf49c5ce31089ac83118574c888669355aaae1
      RUST_VERSAO: 1.99.1
      SISTEMA: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install "$RUST_VERSAO" --profile minimal && rustup default "$RUST_VERSAO" && rustc --version
      - name: m4, que a GMP do Carcara precisa para compilar
        run: sudo apt-get update && sudo apt-get install -y m4
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: ~/.cargo/bin/carcara
          key: carcara-${{ env.CARCARA_COMMIT }}-rust-${{ env.RUST_VERSAO }}-${{ env.SISTEMA }}
      - name: Compilar o Carcara
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/ufmg-smite/carcara.git --rev "$CARCARA_COMMIT" carcara
      # guardado logo depois de compilar: fica guardado mesmo que a conferência falhe
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/carcara
          key: carcara-${{ env.CARCARA_COMMIT }}-rust-${{ env.RUST_VERSAO }}-${{ env.SISTEMA }}
      # o SymPy e o mpmath, com os hashes de requisitos.txt, para a conferência independente dos modelos exatos
      # (num bloco: sem aspas, o ": " de :all: faria o YAML ler outra coisa)
      - name: SymPy
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install --require-hashes --only-binary :all: --no-deps -r especificacao/provas-t1/requisitos.txt
      # o próprio conferir.py escreve o relatório no resumo da execução
      - name: Conferir as provas, os estragos, o vínculo e o lote cego 1
        run: ~/venv/bin/python especificacao/provas-t1/conferir.py --carcara ~/.cargo/bin/carcara
      # o segundo Carcara, independente da compilação acima: o binário oficial da release 1.1.0, com o SHA-256 fixado
      # na passagem de 25/10/2026 (Apêndice C)
      - name: Carcara oficial 1.1.0 (binário da release, hash fixado)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 \
            -o "$RUNNER_TEMP/carcara-linux" https://github.com/ufmg-smite/carcara/releases/download/carcara-1.1.0/carcara-linux
          printf '%s  %s\n' fcd06852931d36b13e6d3f7965c81a068f5cfe2f3c5e7da2d91af500f8f1bfda "$RUNNER_TEMP/carcara-linux" | sha256sum --check --strict
          chmod u+x "$RUNNER_TEMP/carcara-linux"
      - name: Conferir a prova pública 5p4c pelos dois Carcaras, com estragos
        run: python3 scripts/conferir-5p4c.py compilado="$HOME/.cargo/bin/carcara" oficial="$RUNNER_TEMP/carcara-linux"
